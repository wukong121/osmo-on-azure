# Point-foot biped sim2sim validation at scale: model registry -> N parallel MuJoCo shards -> gate.
#
#   fetch        Resolve the models under test in the AzureML registry and download them, plus the
#                scenario data asset (robot MJCF + scenarios) from the data lake:
#                  models=<name>:<version>  candidate + current champion (tag stage=production)
#                  models=<name>:all        every registered version (re-validation on new data)
#   validate-i   Shard i of <shards>: every model on scenarios with id % shards == i, in MuJoCo
#                (headless, deterministic, 1 kHz physics / 50 Hz policy). Pure simulation.
#   gazebo-i     Shard i of <gazebo_shards> (0 = off): every model on a deterministic subset of
#                the scenarios (gazebo_subset_in + gazebo_subset_out; latency scenarios skipped)
#                in Gazebo Classic 11 with the vendor's ROS 2 stack (ros2_control hardware plugin
#                + C++ RL controller), real time. Image <gazebo_image> from the private ACR
#                (deploy/images/legged-gazebo-ros2, built by build-image.yaml).
#   gate         Merge the shards, score each model per simulator on the in-distribution scenarios
#                (fall rate <= max_fall_rate, velocity RMSE <= max_lin_vel_rmse), break failures
#                down by stress factor, log one MLflow run per model, tag the model versions, and
#                (mode=promote) promote the candidate to stage=production if it passes and is not
#                worse than the champion. Fails the workflow when the candidate fails the gate
#                (promote) or the production model no longer passes (revalidate).
#
#   publish      (stage=shards) upload the shard outputs of this pool to the AzureML data lake
#                (sim2sim-runs/<run_id>/<pool_label>/...)
#   collect      (stage=gate) download every shard output of <run_id>, from all pools
#
# Stages: one OSMO workflow runs in one pool. stage=all runs everything in this workflow;
# for a hybrid run, submit stage=shards to several pools (each with its own shard ranges,
# mujoco_from/mujoco_to, gazebo_from/gazebo_to, and the same run_id), then stage=gate in Azure.
#
# Prepare the data asset and the model versions with legged-seed.yaml first.
# Submit with deploy/scripts/08-legged-sim2sim.sh (validate / revalidate / campaign).
workflow:
  name: legged-validate
  timeout:
    # Gazebo shards run in real time (~30 min each) and queue behind each other when the CPU
    # pool is full, so allow a long queue
    exec_timeout: 120m
    queue_timeout: 120m
  resources:
    cpu1:
      cpu: 1
      memory: 2Gi
      storage: 2Gi
    cpu2:
      cpu: 2
      memory: 4Gi
      storage: 5Gi
    gazebo:
      cpu: 2
      memory: 6Gi
      storage: 10Gi
{% set m_to = (mujoco_to|int) if (mujoco_to|int) >= 0 else (shards|int) %}
{% set g_to = (gazebo_to|int) if (gazebo_to|int) >= 0 else (gazebo_shards|int) %}
{% set run_shards = stage in ['all', 'shards'] %}
  tasks:
  - name: fetch
    image: python:3.12-slim
    resource: cpu2
    files:
    - localpath: files/rl/aml_common.py
      path: /opt/legged/aml_common.py
    - localpath: files/rl/data_assets.py
      path: /opt/legged/data_assets.py
    - localpath: files/legged/scenarios.py
      path: /opt/legged/scenarios.py
    - localpath: files/legged/assets.py
      path: /opt/legged/assets.py
    environment:
      AML_SUBSCRIPTION_ID: "{{aml_subscription_id}}"
      AML_RESOURCE_GROUP: "{{aml_resource_group}}"
      AML_WORKSPACE: "{{aml_workspace}}"
      OSMO_WORKFLOW_ID: "{{workflow_id}}"
      GIT_PYTHON_REFRESH: quiet
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail
      pip install --quiet --no-cache-dir azure-ai-ml==1.35.2 azure-identity==1.27.0 azure-storage-blob==12.27.1 \
        mlflow-skinny==3.15.0 azureml-mlflow==1.62.0.post6 numpy
      cd /opt/legged
      python assets.py fetch --models "{{models}}" --dataset "{{dataset}}" --experiment "{{experiment}}" --out {{output}}
      cat {{output}}/models/models.json {{output}}/data/data_asset.json

{% if run_shards %}
{% for i in range(mujoco_from|int, m_to) %}
  - name: validate-{{i}}
    image: python:3.12-slim
    resource: cpu1
    inputs:
    - task: fetch
    files:
    - localpath: files/legged/pointfoot_sim.py
      path: /opt/legged/pointfoot_sim.py
    - localpath: files/legged/episode_metrics.py
      path: /opt/legged/episode_metrics.py
    - localpath: files/legged/validate_shard.py
      path: /opt/legged/validate_shard.py
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail
      pip install --quiet --no-cache-dir mujoco==3.17.0 onnxruntime==1.31.1 numpy scipy pyyaml
      cd /opt/legged
      python validate_shard.py --data-dir {{input:0}}/data --models-dir {{input:0}}/models \
        --shard {{i}} --shards {{shards}} --out {{output}}
{% endfor %}

{% for i in range(gazebo_from|int, g_to) %}
  - name: gazebo-{{i}}
    image: "{{gazebo_image}}"
    resource: gazebo
    inputs:
    - task: fetch
    files:
    - localpath: files/legged/episode_metrics.py
      path: /opt/legged/episode_metrics.py
    - localpath: files/legged/gazebo_episode.py
      path: /opt/legged/gazebo_episode.py
    - localpath: files/legged/validate_gazebo_shard.py
      path: /opt/legged/validate_gazebo_shard.py
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    command: ["bash", "-c"]
    args:
    - |
      set -eo pipefail
      source /etc/profile.d/ros.sh
      cd /opt/legged
      python3 validate_gazebo_shard.py --data-dir {{input:0}}/data --models-dir {{input:0}}/models \
        --shard {{i}} --shards {{gazebo_shards}} --subset-in {{gazebo_subset_in}} --subset-out {{gazebo_subset_out}} \
        --out {{output}} 2>&1 | grep -v -E "RTPS_TRANSPORT_SHM|RTPS_PARTICIPANT"
{% endfor %}
{% endif %}

{% if stage == 'shards' %}
  - name: publish
    image: python:3.12-slim
    resource: cpu2
    inputs:
{% for i in range(mujoco_from|int, m_to) %}
    - task: validate-{{i}}
{% endfor %}
{% for i in range(gazebo_from|int, g_to) %}
    - task: gazebo-{{i}}
{% endfor %}
    files:
    - localpath: files/rl/aml_common.py
      path: /opt/legged/aml_common.py
    - localpath: files/rl/data_assets.py
      path: /opt/legged/data_assets.py
    - localpath: files/legged/results.py
      path: /opt/legged/results.py
    environment:
      AML_SUBSCRIPTION_ID: "{{aml_subscription_id}}"
      AML_RESOURCE_GROUP: "{{aml_resource_group}}"
      AML_WORKSPACE: "{{aml_workspace}}"
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail
      pip install --quiet --no-cache-dir azure-ai-ml==1.35.2 azure-identity==1.27.0 azure-storage-blob==12.27.1 numpy
      cd /opt/legged
      python results.py publish --run-id "{{run_id}}" --pool "{{pool_label}}" \
        --src $(find "$(dirname {{input:0}})" -name shard.json -exec dirname {} \; | sort)
{% endif %}

{% if stage in ['all', 'gate'] %}
{% if stage == 'gate' %}
  - name: collect
    image: python:3.12-slim
    resource: cpu2
    files:
    - localpath: files/rl/aml_common.py
      path: /opt/legged/aml_common.py
    - localpath: files/rl/data_assets.py
      path: /opt/legged/data_assets.py
    - localpath: files/legged/results.py
      path: /opt/legged/results.py
    environment:
      AML_SUBSCRIPTION_ID: "{{aml_subscription_id}}"
      AML_RESOURCE_GROUP: "{{aml_resource_group}}"
      AML_WORKSPACE: "{{aml_workspace}}"
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail
      pip install --quiet --no-cache-dir azure-ai-ml==1.35.2 azure-identity==1.27.0 azure-storage-blob==12.27.1 numpy
      cd /opt/legged
      python results.py collect --run-id "{{run_id}}" --out {{output}}
{% endif %}

  - name: gate
    image: python:3.12-slim
    resource: cpu2
    inputs:
    - task: fetch
{% if stage == 'gate' %}
    - task: collect
{% else %}
{% for i in range(mujoco_from|int, m_to) %}
    - task: validate-{{i}}
{% endfor %}
{% for i in range(gazebo_from|int, g_to) %}
    - task: gazebo-{{i}}
{% endfor %}
{% endif %}
    files:
    - localpath: files/rl/aml_common.py
      path: /opt/legged/aml_common.py
    - localpath: files/legged/gate.py
      path: /opt/legged/gate.py
    environment:
      AML_SUBSCRIPTION_ID: "{{aml_subscription_id}}"
      AML_RESOURCE_GROUP: "{{aml_resource_group}}"
      AML_WORKSPACE: "{{aml_workspace}}"
      OSMO_WORKFLOW_ID: "{{workflow_id}}"
      GIT_PYTHON_REFRESH: quiet
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail
      pip install --quiet --no-cache-dir azure-ai-ml==1.35.2 azure-identity==1.27.0 \
        mlflow-skinny==3.15.0 azureml-mlflow==1.62.0.post6 matplotlib
      # Every validate-i output folder holds a shard.json (input folders are siblings of input 0)
      SHARDS=(); while read -r f; do SHARDS+=(--shard-dir "$(dirname "$f")"); done \
        < <(find "$(dirname {{input:0}})" -name shard.json | sort)
      echo "found $(find "$(dirname {{input:0}})" -name shard.json | wc -l) shards (expected {{shards}} MuJoCo + {{gazebo_shards}} Gazebo)"
      [ -f "$(dirname {{input:0}})/1/run.json" ] && cat "$(dirname {{input:0}})/1/run.json" && echo
      cd /opt/legged
      python gate.py --models-json {{input:0}}/models/models.json --data-asset-json {{input:0}}/data/data_asset.json \
        "${SHARDS[@]}" --expect-shards mujoco={{shards}} --expect-shards gazebo={{gazebo_shards}} --mode "{{mode}}" --max-fall-rate {{max_fall_rate}} --max-lin-vel-rmse {{max_lin_vel_rmse}} \
        --experiment "{{experiment}}" --out {{output}}
{% endif %}

default-values:
  aml_subscription_id: ""
  aml_resource_group: ""
  aml_workspace: ""
  models: "pointfoot-policy:1"
  dataset: pointfoot-sim2sim-scenarios
  mode: promote
  shards: 10
  gazebo_shards: 0           # e.g. 8; needs gazebo_image
  gazebo_image: ""           # <acr>.azurecr.io/legged-gazebo-ros2:<tag>
  gazebo_subset_in: 120
  gazebo_subset_out: 80
  max_fall_rate: 0.05
  max_lin_vel_rmse: 0.3
  experiment: pointfoot-sim2sim
  stage: all                 # all | shards | gate (hybrid runs across pools)
  run_id: ""                 # shared by the shards and gate workflows of a hybrid run
  pool_label: ""             # pool name recorded with published shard results
  mujoco_from: 0             # shard range of this workflow (to = -1: up to shards / gazebo_shards)
  mujoco_to: -1
  gazebo_from: 0
  gazebo_to: -1
