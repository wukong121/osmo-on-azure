# Base definition of the "osmo" realm (imported once by the Keycloak Operator).
# scripts/06-keycloak-login.sh adds the users and the KeycloakRealmImport wrapper.
# Placeholders (${...}) are filled from Secret keycloak/keycloak-osmo-secrets; ${OSMO_HOSTNAME}
# is substituted by the script. No secrets in this file.
#
# OSMO authorization: the realm roles osmo-admin / osmo-user are emitted as the top-level "roles"
# claim, which the OSMO gateway forwards as x-osmo-roles; OSMO's roles with the same names apply.
realm: osmo
displayName: OSMO
enabled: true
sslRequired: external
registrationAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
resetPasswordAllowed: false
bruteForceProtected: true
# Token / session lifetimes. ID tokens must outlive oauth2-proxy's cookie refresh interval
# (10m, values/osmo-service-keycloak.yaml), otherwise the gateway rejects them ("Jwt is expired").
accessTokenLifespan: 900        # 15 min (also the ID token lifetime)
ssoSessionIdleTimeout: 28800    # 8 h idle
ssoSessionMaxLifespan: 43200    # 12 h max
roles:
  realm:
    - name: osmo-admin
      description: OSMO administrators (full access)
    - name: osmo-user
      description: OSMO users (submit and manage workflows in pool default)
groups:
  - name: osmo-admins
    realmRoles: [osmo-admin, osmo-user]
  - name: osmo-users
    realmRoles: [osmo-user]
clients:
  - clientId: osmo-web
    name: OSMO web (oauth2-proxy)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: "${OSMO_WEB_CLIENT_SECRET}"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "https://${OSMO_HOSTNAME}/oauth2/callback"
    webOrigins:
      - "https://${OSMO_HOSTNAME}"
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "https://${OSMO_HOSTNAME}/*"
    protocolMappers:
      - name: osmo-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-realm-role-mapper
        config:
          claim.name: roles
          multivalued: "true"
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
      - name: osmo-web-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: osmo-web
          id.token.claim: "true"
          access.token.claim: "true"
